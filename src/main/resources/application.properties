spring.application.name=titlerate-java

# H2 for local dev (override with DATABASE_URL in production)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:titlerate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Actuator: expose health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
jwt.secret=${JWT_SECRET:change-me-to-at-least-32-char-secret-key}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
