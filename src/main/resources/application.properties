spring.application.name=titlerate-java

# No default. A missing DATABASE_URL should stop the app rather than silently
# start it against an in-memory database that looks healthy and holds nothing.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that the entities still match it.
# This was create-drop, which dropped every table on shutdown and recreated it on
# boot, so each deploy silently wiped every registered user.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Actuator: expose health, metrics, and prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never

# Ceilings for the two unauthenticated auth endpoints, per caller. Register writes
# a row, so a flood costs storage; login costs a BCrypt verification each attempt.
auth.ratelimit.register-per-hour=${AUTH_REGISTER_PER_HOUR:5}
auth.ratelimit.login-per-minute=${AUTH_LOGIN_PER_MINUTE:10}

# Behind a reverse proxy every request arrives from the proxy, which would put every
# caller in one rate-limit bucket. NATIVE hands this to Tomcat's RemoteIpValve,
# which rewrites the remote address from X-Forwarded-For only when the immediate
# peer is in its internalProxies set (private ranges), so a caller reaching the port
# directly cannot spoof the header to get a fresh budget.
server.forward-headers-strategy=NATIVE

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
