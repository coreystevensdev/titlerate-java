# Named application-test.properties, not application.properties, and activated by
# @ActiveProfiles("test"). A file at src/test/resources/application.properties has
# the same classpath path as the main one and shadows it completely rather than
# merging, which silently dropped ddl-auto=validate and spring.flyway.enabled in
# tests. Three deliberate schema mutations passed before this was noticed.
#
# The main config has no default for jwt.secret on purpose, so a deployment missing
# it fails to start rather than signing with an empty key. This supplies one for
# tests only.
jwt.secret=test-signing-key-at-least-32-characters-long
