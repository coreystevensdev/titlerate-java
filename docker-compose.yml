services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: titlerate
      POSTGRES_PASSWORD: titlerate
      POSTGRES_DB: titlerate
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/titlerate
      DB_DRIVER: org.postgresql.Driver
      DB_USER: titlerate
      DB_PASSWORD: titlerate
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: 24
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

volumes:
  pgdata:
