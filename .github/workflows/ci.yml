name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    # No postgres service here on purpose. The tests start their own via
    # Testcontainers, so a second one would sit idle while looking load-bearing.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw verify -q

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -f Dockerfile -t titlerate-java:smoke .

      # Was pointed at jdbc:h2:mem with the H2 driver, which is no longer a
      # dependency, and then only ran `docker logs` with nothing asserted after it,
      # so the step passed whether or not the app had started. It starts against a
      # real Postgres now and the job fails unless the app reports UP.
      - name: Verify the image boots and reports healthy
        run: |
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_USER=titlerate \
            -e POSTGRES_PASSWORD=titlerate \
            -e POSTGRES_DB=titlerate \
            postgres:16-alpine
          for i in $(seq 1 20); do
            docker exec smoke-db pg_isready -U titlerate && break
            sleep 2
          done

          docker run -d --name smoke --network smoke-net -p 8080:8080 \
            -e DATABASE_URL=jdbc:postgresql://smoke-db:5432/titlerate \
            -e DB_DRIVER=org.postgresql.Driver \
            -e DB_USER=titlerate \
            -e DB_PASSWORD=titlerate \
            -e JWT_SECRET=ci-smoke-signing-key-at-least-32-chars \
            titlerate-java:smoke

          ok=0
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy after $((i * 5))s"
              ok=1
              break
            fi
            sleep 5
          done

          if [ "$ok" != 1 ]; then
            echo "never reported UP"
            docker logs smoke
            exit 1
          fi

          # Flyway ran and the seed landed, so the calculator answers rather than
          # just the health endpoint.
          curl -fsS -X POST http://localhost:8080/api/calculate \
            -H 'Content-Type: application/json' \
            -d '{"state":"PA","policyType":"OWNER","amount":50000,"simultaneousIssue":false}' \
            | grep -q '"basePremium"' || { echo "calculate did not answer"; docker logs smoke; exit 1; }
          echo "calculate answered"

      - name: Clean up
        if: always()
        run: docker rm -f smoke smoke-db || true
