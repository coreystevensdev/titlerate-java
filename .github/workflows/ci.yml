name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app_admin
          POSTGRES_PASSWORD: app
          POSTGRES_DB: titlerate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw verify -q
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/titlerate_test
          DB_DRIVER: org.postgresql.Driver
          DB_USER: app_admin
          DB_PASSWORD: app

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -f Dockerfile -t titlerate-java:smoke .

      - name: Verify image starts
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL=jdbc:h2:mem:testdb \
            -e DB_DRIVER=org.h2.Driver \
            -p 8080:8080 \
            titlerate-java:smoke
          sleep 10
          docker logs smoke
          docker rm -f smoke
